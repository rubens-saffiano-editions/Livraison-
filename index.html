<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Bon de Livraison — Rubens Saffiano</title>
<meta name="theme-color" content="#F7F5F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root { 
    --f: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; 
    --fond: #F7F5F0;
    --texte: #111;
    --ligne: #d4cec4;
  }
  
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-weight: normal; }
  
  html, body {
    background-color: var(--fond);
    color: var(--texte);
    font-family: var(--f);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    height: 100dvh; 
    overflow: hidden; 
    display: flex;
    flex-direction: column;
  }
  
  /* --- En-tête --- */
  header.entete {
    height: 52px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--fond);
    z-index: 1000;
    padding: 0 20px;
    position: relative;
  }
  
  .vague-gauche, .vague-droite {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--ligne));
    opacity: 0;
    animation: fadeIn 1.5s ease 0.5s forwards;
  }
  .vague-gauche { margin-right: 15px; }
  .vague-droite { background: linear-gradient(90deg, var(--ligne), transparent); margin-left: 15px; }

  header.entete .marque {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--texte);
    opacity: 0;
    animation: fadeIn 1.5s ease 0.3s forwards;
    white-space: nowrap;
  }

  header.entete::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 1px;
    background-color: #e3ded5;
    animation: expandLine 1.5s cubic-bezier(0.8, 0, 0.2, 1) forwards;
  }

  /* --- Animations --- */
  @keyframes expandLine { to { width: 100%; } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .anim {
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  .d-1 { animation-delay: 0.1s; }
  .d-2 { animation-delay: 0.2s; }
  .d-3 { animation-delay: 0.3s; }
  .d-4 { animation-delay: 0.4s; }

  /* --- Conteneur Flexbox --- */
  main.conteneur {
    flex: 1; 
    display: flex;
    flex-direction: column;
    max-width: 600px;
    margin: 0 auto;
    width: 100%;
    padding: 16px 24px 24px;
    overflow-y: auto; 
  }
  
  /* --- Titres de section --- */
  .titre-section {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    margin: 20px 0 10px 0;
    border-bottom: 1px solid #e3ded5;
    padding-bottom: 6px;
    color: var(--texte);
  }
  .titre-section:first-child { margin-top: 8px; }
  
  /* --- Champs et Zone de texte --- */
  .champ, .champ-zone { 
    margin-bottom: 16px; 
    position: relative; 
  }
  
  .champ input, 
  .champ textarea,
  .champ-zone textarea {
    width: 100%;
    font-family: var(--f) !important;
    font-size: 15px !important;
    font-weight: 300 !important;
    color: var(--texte) !important;
    border: 0;
    border-bottom: 1px solid var(--ligne);
    background: transparent;
    padding: 12px 0 8px 0;
    outline: none;
    border-radius: 0;
    appearance: none;
    transition: border-color 0.3s ease;
  }
  
  .champ input:focus, 
  .champ textarea:focus,
  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte);
  }
  
  .champ input::placeholder, 
  .champ textarea::placeholder,
  .champ-zone textarea::placeholder { 
    color: #888; 
    font-family: var(--f) !important;
    font-size: 15px !important;
    font-weight: 300 !important;
  }

  /* --- ZONE DE TEXTE --- */
  .section-qualite {
    flex: 1; 
    display: flex;
    flex-direction: column;
    min-height: 100px;
  }
  
  .champ-zone {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 0;
  }

  .champ-zone textarea { 
    flex: 1; 
    border: none !important;
    border-bottom: 1px solid var(--ligne) !important; 
    background: transparent !important; 
    box-shadow: none !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    resize: none !important; 
    border-radius: 0 !important;
  }

  .champ-zone textarea:focus {
    border-bottom: 1px solid var(--texte) !important;
    background: transparent !important;
  }

  /* --- Grille --- */
  .grille { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    column-gap: 20px; 
  }
  
  /* --- Bouton --- */
  .bouton-wrapper {
    margin-top: auto; 
    padding-top: 20px;
  }

  .bouton {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--texte);
    color: var(--fond);
    border: 1px solid var(--texte);
    padding: 16px;
    font-family: var(--f);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .bouton:hover { background: transparent; color: var(--texte); }
  .bouton svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  /* --- Champ obligatoire non rempli --- */
  .champ.manquant input { border-bottom: 1px solid var(--texte); }
  .champ.manquant input::placeholder { color: var(--texte); }
  .alerte {
    font-size: 11px;
    letter-spacing: .08em;
    color: var(--texte);
    text-align: center;
    min-height: 16px;
    margin-bottom: 10px;
    opacity: 0;
    transition: opacity .3s ease;
  }
  .alerte.visible { opacity: 1; }
  .champ input[type=number]::-webkit-outer-spin-button,
  .champ input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body>

  <header class="entete">
    <div class="vague-gauche"></div>
    <span class="marque">RUBENS SAFFIANO</span>
    <div class="vague-droite"></div>
  </header>

  <main class="conteneur" id="zone-formulaire">

    <!-- Section 1 : Livraison -->
    <div class="anim d-1">
      <div class="titre-section">01. Informations de Livraison</div>
      <div class="grille">
        <div class="champ">
          <input type="text" id="nom" placeholder="Nom *" autocomplete="family-name" data-requis="Nom">
        </div>
        <div class="champ">
          <input type="text" id="prenom" placeholder="Prénom *" autocomplete="given-name" data-requis="Prénom">
        </div>
      </div>
      <div class="champ">
        <input type="tel" id="tel" placeholder="Numéro de téléphone *" autocomplete="tel" data-requis="Téléphone">
      </div>
      <div class="champ">
        <input type="text" id="adresse" placeholder="Adresse (numéro et rue) *" autocomplete="street-address" data-requis="Adresse">
      </div>
      <div class="grille">
        <div class="champ">
          <input type="text" id="cp" placeholder="Code postal *" autocomplete="postal-code" inputmode="numeric" maxlength="5" data-requis="Code postal">
        </div>
        <div class="champ">
          <input type="text" id="ville" placeholder="Ville *" autocomplete="address-level2" data-requis="Ville">
        </div>
      </div>
      <div class="champ">
        <input type="text" id="interphone" placeholder="Nom ou numéro d'interphone">
      </div>
    </div>

    <!-- Section 2 : Confirmation de tarif -->
    <div class="anim d-2">
      <div class="titre-section">02. Confirmation de Tarif</div>
      <div class="grille">
        <div class="champ">
          <input type="text" id="qualite" placeholder="Qualité souhaitée *" data-requis="Qualité souhaitée">
        </div>
        <div class="champ">
          <input type="text" id="tarif" placeholder="Tarif convenu (€) *" inputmode="decimal" data-requis="Tarif convenu">
        </div>
      </div>
    </div>

    <!-- Section 3 : Précisions -->
    <div class="anim d-3 section-qualite">
      <div class="titre-section">03. Précisions de Commande</div>
      <div class="champ-zone">
        <textarea id="precisions" placeholder="Modèle, couleur, finitions, créneau de livraison souhaité..."></textarea>
      </div>
    </div>

    <!-- Bouton WhatsApp -->
    <div class="anim d-4 bouton-wrapper">
      <div class="alerte" id="alerte"></div>
      <button type="button" class="bouton" id="envoyer">
        <svg viewBox="0 0 24 24"><path d="M12 3.2a8.8 8.8 0 0 0-7.6 13.2L3.3 20.7l4.4-1.1A8.8 8.8 0 1 0 12 3.2Z"/><path d="M8.9 8.3c.2-.5.6-.6 1-.6l.6 1.6-.7.9c.6 1.4 1.7 2.5 3.1 3.1l.9-.7 1.6.6c0 .4-.1.8-.6 1-2.9.8-6.6-2.9-5.9-5.9Z"/></svg>
        Confirmer ma commande
      </button>
    </div>

  </main>

  <script>
    function val(id){ return document.getElementById(id).value.trim(); }

    // Le champ redevient normal dès que le client écrit dedans
    document.querySelectorAll("[data-requis]").forEach(function(el){
      el.addEventListener("input", function(){ el.parentNode.classList.remove("manquant"); });
    });

    document.getElementById("envoyer").addEventListener("click", function(){
      // 1. Vérifier les champs obligatoires
      var manquants = [];
      document.querySelectorAll("[data-requis]").forEach(function(el){
        var vide = el.value.trim() === "";
        el.parentNode.classList.toggle("manquant", vide);
        if (vide) manquants.push(el.getAttribute("data-requis"));
      });
      var alerte = document.getElementById("alerte");
      if (manquants.length) {
        alerte.textContent = "Merci de compléter : " + manquants.join(", ");
        alerte.classList.add("visible");
        document.querySelector(".manquant input").focus();
        return;
      }
      alerte.classList.remove("visible");

      // 2. Composer le message (écrit par le client, à l'attention de l'atelier)
      var tarif = val("tarif").replace(/\s*€\s*$/, "") + " €";
      var message =
        "*BON DE LIVRAISON — RUBENS SAFFIANO*\n\n" +
        "Bonjour, je confirme ma commande :\n\n" +
        "*01. LIVRAISON*\n" +
        "• *Nom :* " + val("nom") + "\n" +
        "• *Prénom :* " + val("prenom") + "\n" +
        "• *Téléphone :* " + val("tel") + "\n" +
        "• *Adresse :* " + val("adresse") + "\n" +
        "• *Code postal :* " + val("cp") + "\n" +
        "• *Ville :* " + val("ville") + "\n" +
        "• *Interphone :* " + (val("interphone") || "—") + "\n\n" +
        "*02. CONFIRMATION DE TARIF*\n" +
        "• *Qualité souhaitée :* " + val("qualite") + "\n" +
        "• *Tarif convenu :* " + tarif + "\n\n" +
        "*03. PRÉCISIONS*\n" +
        (val("precisions") || "Aucune précision.");

      // 3. Ouvrir WhatsApp avec le message pré-rempli
      var numWA = "33695772805";
      window.open("https://wa.me/" + numWA + "?text=" + encodeURIComponent(message), "_blank", "noopener");
    });
  </script>

</body>
</html>
